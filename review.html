<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ôn tập từ vựng</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <div class="wrap">
    <!-- Màn hình thiết lập -->
    <div id="setup" class="card">
      <h1>📚 Ôn tập từ vựng</h1>

      <div id="resumeBanner" class="resume-banner hidden">
        <div class="rb-text">Bạn đang ôn dở — còn <b id="rbCount">0</b> từ.</div>
        <div class="rb-actions">
          <button id="resumeBtn" class="primary">Tiếp tục</button>
          <button id="dismissResumeBtn" class="ghost">Bỏ qua</button>
        </div>
      </div>

      <div id="streak" class="streak hidden"></div>

      <div id="dash" class="dash"></div>

      <div class="field">
        <label>Bộ từ</label>
        <input type="text" id="deckFilter" class="deck-filter hidden" placeholder="🔍 Tìm bộ từ…" />
        <div class="deck-grid" id="deckGrid"></div>
      </div>

      <div class="field">
        <label>Level</label>
        <select id="level">
          <option value="">Tất cả level</option>
          <option>A1</option><option>A2</option><option>B1</option>
          <option>B2</option><option>C1</option><option>C2</option>
        </select>
      </div>

      <div class="field">
        <label>Kiểu ôn</label>
        <div class="btn-group" id="mode">
          <button data-v="flashcard" class="active">Flashcard</button>
          <button data-v="quiz">Trắc nghiệm</button>
          <button data-v="type">Gõ lại từ</button>
        </div>
      </div>

      <div class="field">
        <label>Chế độ</label>
        <div class="btn-group" id="schedule">
          <button data-v="srs" class="active">Đến hạn (thông minh)</button>
          <button data-v="all">Ôn tất cả</button>
        </div>
        <p class="hint" id="scheduleHint"></p>
      </div>

      <div class="field">
        <label>Số từ mỗi vòng</label>
        <select id="batchSize">
          <option value="10">10 từ</option>
          <option value="20" selected>20 từ</option>
          <option value="50">50 từ</option>
          <option value="all">Tất cả</option>
        </select>
      </div>

      <button id="start" class="primary big">Bắt đầu ôn</button>
      <p class="hint" id="poolInfo"></p>
    </div>

    <!-- Màn hình ôn -->
    <div id="session" class="card hidden">
      <div class="progress"><div id="progressBar"></div></div>
      <div class="counter"><span id="idx">0</span>/<span id="total">0</span></div>

      <!-- Flashcard -->
      <div id="flashcard" class="stage hidden">
        <div class="flip" id="flip">
          <div class="flip-inner" id="flipInner">
            <div class="flip-front">
              <div class="big-word" id="fcWord"></div>
              <button class="speak-btn" id="fcSpeak">🔊</button>
              <p class="tap-hint">Bấm hoặc nhấn <span class="kbd-hint">Space</span> để xem nghĩa</p>
            </div>
            <div class="flip-back">
              <div class="meaning" id="fcMeaning"></div>
            </div>
          </div>
        </div>
        <div class="grade hidden" id="fcGrade">
          <button class="wrong" data-ok="0">😕 Chưa nhớ <span class="kbd-hint">←</span></button>
          <button class="right" data-ok="1">😄 Nhớ rồi <span class="kbd-hint">→</span></button>
        </div>
      </div>

      <!-- Trắc nghiệm -->
      <div id="quiz" class="stage hidden">
        <div class="big-word" id="qzWord"></div>
        <button class="speak-btn" id="qzSpeak">🔊</button>
        <p class="q-hint">Chọn nghĩa đúng:</p>
        <div class="options" id="qzOptions"></div>
      </div>

      <!-- Gõ lại -->
      <div id="type" class="stage hidden">
        <div class="meaning big" id="tpMeaning"></div>
        <p class="q-hint">Gõ từ tiếng Anh:</p>
        <input id="tpInput" type="text" autocomplete="off" placeholder="Nhập từ…" />
        <button class="primary" id="tpCheck">Kiểm tra</button>
        <div class="tp-result hidden" id="tpResult"></div>
      </div>
    </div>

    <!-- Kết quả -->
    <div id="done" class="card hidden">
      <h1>🎉 Xong buổi ôn!</h1>
      <div class="stats">
        <div><span id="rCorrect">0</span><small>Đúng</small></div>
        <div><span id="rWrong">0</span><small>Sai</small></div>
        <div><span id="rTotal">0</span><small>Tổng</small></div>
        <div><span id="rAcc">0%</span><small>Chính xác</small></div>
      </div>
      <div id="doneStreak" class="streak hidden"></div>
      <button id="nextRound" class="primary big hidden">Vòng tiếp theo</button>
      <button id="again" class="secondary big">Ôn lại</button>
      <button id="backToList" class="text-btn">📋 Về danh sách từ đã lưu</button>
    </div>
  </div>

  <script src="review.js"></script>
</body>
</html>
