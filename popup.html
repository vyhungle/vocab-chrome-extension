<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 390px; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1f2333; background: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    .head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: #fff; border-bottom: 1px solid #e6e8f0;
    }
    .head h1 { font-size: 16px; font-weight: 800; color: #1f2333; margin: 0; display: flex; align-items: center; gap: 6px; }
    .count { font-size: 11px; font-weight: 700; color: #6366f1; background: #edf0ff; padding: 3px 10px; border-radius: 999px; }

    .filters { display: flex; gap: 6px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #e6e8f0; }
    .filters select {
      flex: 1; font-size: 12px; font-weight: 600; padding: 7px 8px; border: 1px solid #e6e8f0;
      border-radius: 9px; background: #fff; color: #1f2333; transition: border-color 0.15s ease;
    }
    .filters select:focus { outline: none; border-color: #6366f1; }

    .list { max-height: 290px; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .item {
      background: #fff; border: 1px solid #e6e8f0; border-radius: 12px;
      padding: 12px 14px; display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px; transition: all 0.15s ease;
    }
    .item:hover { border-color: #6366f1; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.08); transform: translateY(-1px); }
    .item .w { font-weight: 800; font-size: 15px; color: #1f2333; }
    .item .ipa { font-weight: 500; font-size: 12px; color: #7c5cff; margin-left: 4px; }
    .item .m { font-size: 13px; color: #4b5563; margin-top: 3px; font-weight: 500; }
    .item .tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #edf0ff; color: #6366f1; font-weight: 700; }
    .tag.lv { background: #e6f9ef; color: #17b26a; }
    .item .src { font-size: 11px; color: #9aa1b2; margin-top: 4px; }
    .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .ibtn { background: #edf0ff; border: none; cursor: pointer; font-size: 14px; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.15s ease; }
    .ibtn:hover { background: #d0d7ff; }
    .empty { text-align: center; color: #9aa1b2; padding: 36px 12px; font-size: 13px; font-weight: 500; }

    .bar { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #e6e8f0; background: #fff; }
    .bar button { flex: 1; font-size: 12px; font-weight: 700; padding: 9px; border-radius: 999px; border: 1px solid #e6e8f0; background: #fff; color: #4b5563; cursor: pointer; transition: all 0.15s ease; }
    .bar button:hover { background: #f7f8fc; border-color: #cbd5e1; }
    .bar .primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3); }
    .bar .primary:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); transform: translateY(-1px); }
    .danger { color: #ef4444 !important; border-color: #fdeaea !important; }
    .danger:hover { background: #fdeaea !important; }

    .filters2 { display: flex; gap: 6px; padding: 0 14px 10px; background: #fff; border-bottom: 1px solid #e6e8f0; }
    .filters2 input, .filters2 select {
      font-size: 12px; font-weight: 600; padding: 7px 8px; border: 1px solid #e6e8f0; border-radius: 9px; background: #fff; color: #1f2333;
    }
    .filters2 input { flex: 2; }
    .filters2 select { flex: 1; }
    .iconbtn { border: 1px solid #e6e8f0; background: #fff; border-radius: 9px; cursor: pointer; padding: 0 10px; font-size: 13px; transition: background 0.15s ease; }
    .iconbtn:hover { background: #f7f8fc; }

    .item .meta { font-size: 11px; color: #6b7280; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-weight: 600; }
    .item .meta .ok { color: #17b26a; }
    .item .meta .no { color: #ef4444; }
    .item .meta .due-now { color: #f59e0b; font-weight: 700; }
    .mastery { letter-spacing: 1px; color: #f59e0b; font-size: 11px; }
    .mastery .off { color: #e6e8f0; }

    .deck-panel { background: #fff; border-bottom: 1px solid #e6e8f0; padding: 10px 14px; }
    .deck-panel h3 { font-size: 12px; font-weight: 800; margin: 2px 0 8px; color: #1f2333; }
    .deck-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
    .deck-row .dn { flex: 1; font-size: 12px; font-weight: 700; color: #1f2333; }
    .deck-row .dc { font-size: 11px; color: #6b7280; font-weight: 600; }
    .deck-row button { border: 1px solid #e6e8f0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; padding: 3px 8px; font-weight: 600; }
    .deck-row button:hover { background: #f7f8fc; }
    .hidden { display: none !important; }

    .account-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 14px; background: #edf0ff; border-bottom: 1px solid #d6dbff;
    }
    .account-status { font-size: 12px; font-weight: 600; color: #4338ca; }
    .account-panel { background: #fff; border-bottom: 1px solid #e6e8f0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .account-panel input { width: 100%; font-size: 12px; font-weight: 600; padding: 8px 10px; border: 1px solid #e6e8f0; border-radius: 8px; }
    .account-row { display: flex; gap: 6px; }
    .account-row button { flex: 1; font-size: 12px; font-weight: 700; padding: 8px; border-radius: 999px; border: 1px solid #e6e8f0; background: #fff; cursor: pointer; }
    .account-row button:hover { background: #f7f8fc; }
    .account-row button.primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none; }
    .account-row button.primary:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); }
    .account-msg { font-size: 11px; color: #6b7280; font-weight: 600; }
    .account-msg.error { color: #ef4444; }
    .account-msg.ok { color: #17b26a; }
  </style>
</head>
<body>
  <div class="head">
    <h1>📚 VocabShift</h1>
    <span class="count" id="count">0 từ</span>
  </div>

  <div class="account-bar">
    <span class="account-status" id="accountStatus">Chưa đăng nhập</span>
    <button class="iconbtn" id="accountToggle" title="Tài khoản & đồng bộ">☁️</button>
  </div>
  <div id="accountPanel" class="account-panel hidden"></div>

  <div class="filters">
    <select id="filterDeck"><option value="">Tất cả bộ</option></select>
    <select id="filterLevel">
      <option value="">Tất cả level</option>
      <option>A1</option><option>A2</option><option>B1</option>
      <option>B2</option><option>C1</option><option>C2</option>
    </select>
    <button id="manageDecks" class="iconbtn" title="Quản lý bộ từ">⚙</button>
  </div>

  <div class="filters2">
    <input id="search" type="text" placeholder="🔍 Tìm từ hoặc nghĩa…" />
    <select id="sort">
      <option value="date">Mới thêm</option>
      <option value="weak">Yếu nhất</option>
      <option value="due">Sắp đến hạn</option>
      <option value="az">A → Z</option>
    </select>
  </div>

  <div id="deckPanel" class="deck-panel hidden"></div>

  <div class="list" id="list"></div>

  <div class="bar">
    <button id="review" class="primary">📚 Ôn tập</button>
    <button id="copyQuizlet">Copy Quizlet</button>
    <button id="export">Xuất CSV</button>
  </div>
  <div class="bar">
    <button id="backup">⬇ Backup</button>
    <button id="import">⬆ Import</button>
    <button id="clear" class="danger">Xóa hết</button>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" />

  <script src="migrate.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
