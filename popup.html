<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b; background: #f8fafc;
    }
    .head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: #fff; border-bottom: 1px solid #e2e8f0;
    }
    .head h1 { font-size: 15px; margin: 0; }
    .count { font-size: 12px; color: #64748b; }

    .filters { display: flex; gap: 6px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .filters select {
      flex: 1; font-size: 12px; padding: 6px; border: 1px solid #e2e8f0;
      border-radius: 7px; background: #fff;
    }

    .list { max-height: 320px; overflow-y: auto; padding: 6px; }
    .item {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 10px 12px; margin: 6px; display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
    }
    .item .w { font-weight: 700; font-size: 14px; color: #0f172a; }
    .item .ipa { font-weight: 400; font-size: 12px; color: #7c3aed; }
    .item .m { font-size: 13px; color: #475569; margin-top: 2px; }
    .item .tags { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
    .tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: #eef2ff; color: #4338ca; }
    .tag.lv { background: #ecfdf5; color: #047857; }
    .item .src { font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .ibtn { background: transparent; border: none; cursor: pointer; font-size: 14px; padding: 4px; border-radius: 6px; }
    .ibtn:hover { background: #f1f5f9; }
    .empty { text-align: center; color: #94a3b8; padding: 30px 12px; font-size: 13px; }

    .bar { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e2e8f0; background: #fff; }
    .bar button { flex: 1; font-size: 12px; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; }
    .bar button:hover { background: #f1f5f9; }
    .bar .primary { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
    .bar .primary:hover { background: #1d4ed8; }
    .danger { color: #dc2626; }

    .filters2 { display: flex; gap: 6px; padding: 0 12px 10px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .filters2 input, .filters2 select {
      font-size: 12px; padding: 6px; border: 1px solid #e2e8f0; border-radius: 7px; background: #fff;
    }
    .filters2 input { flex: 2; }
    .filters2 select { flex: 1; }
    .iconbtn { border: 1px solid #e2e8f0; background: #fff; border-radius: 7px; cursor: pointer; padding: 0 9px; font-size: 13px; }
    .iconbtn:hover { background: #f1f5f9; }

    .item .meta { font-size: 11px; color: #64748b; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .item .meta .ok { color: #16a34a; }
    .item .meta .no { color: #dc2626; }
    .item .meta .due-now { color: #d97706; font-weight: 600; }
    .mastery { letter-spacing: 1px; color: #f59e0b; font-size: 11px; }
    .mastery .off { color: #e2e8f0; }

    .deck-panel { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 8px 12px; }
    .deck-panel h3 { font-size: 12px; margin: 2px 0 8px; color: #334155; }
    .deck-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
    .deck-row .dn { flex: 1; font-size: 12px; color: #0f172a; }
    .deck-row .dc { font-size: 11px; color: #94a3b8; }
    .deck-row button { border: 1px solid #e2e8f0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; padding: 3px 7px; }
    .deck-row button:hover { background: #f1f5f9; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="head">
    <h1>Từ đã lưu</h1>
    <span class="count" id="count">0</span>
  </div>

  <div class="filters">
    <select id="filterDeck"><option value="">Tất cả bộ</option></select>
    <select id="filterLevel">
      <option value="">Tất cả level</option>
      <option>A1</option><option>A2</option><option>B1</option>
      <option>B2</option><option>C1</option><option>C2</option>
    </select>
    <button id="manageDecks" class="iconbtn" title="Quản lý bộ từ">⚙</button>
  </div>

  <div class="filters2">
    <input id="search" type="text" placeholder="🔍 Tìm từ hoặc nghĩa…" />
    <select id="sort">
      <option value="date">Mới thêm</option>
      <option value="weak">Yếu nhất</option>
      <option value="due">Sắp đến hạn</option>
      <option value="az">A → Z</option>
    </select>
  </div>

  <div id="deckPanel" class="deck-panel hidden"></div>

  <div class="list" id="list"></div>

  <div class="bar">
    <button id="review" class="primary">📚 Ôn tập</button>
    <button id="copyQuizlet">Copy Quizlet</button>
    <button id="export">Xuất CSV</button>
  </div>
  <div class="bar">
    <button id="backup">⬇ Backup</button>
    <button id="import">⬆ Import</button>
    <button id="clear" class="danger">Xóa hết</button>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" />

  <script src="popup.js"></script>
</body>
</html>
